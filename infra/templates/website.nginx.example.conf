# Example public website vhost; set your real domain, TLS and build path.
# /admin-api is served by the separately authenticated management vhost, never this public gateway.
server {
    listen 443 ssl;
    server_name website.example.com;
    root /srv/vibe/website;
    ssl_certificate /etc/ssl/website/fullchain.pem;
    ssl_certificate_key /etc/ssl/website/privkey.pem;
    client_max_body_size 64k;

    location ~ ^/app-api/edu/(website-offering/list|website-admission/(options|create)|course/(page|get)|cohort/(list|get)|campus/list|teacher/list|config/get)$ {
        proxy_pass http://127.0.0.1:48080;
        proxy_set_header tenant-id 1;
        proxy_set_header X-Vibe-Client-IP $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_read_timeout 15s;
        add_header Cache-Control no-store always;
    }
    location /app-api/ { return 404; }
    location /admin-api/ { return 404; }
    location / { try_files $uri $uri/ /index.html; }
}
